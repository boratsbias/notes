<nav id="breadcrumbs" class="breadcrumbs"></nav>
<script>
(function () {
  var LABELS = {
    'ai': 'AI',
    'nlp': 'NLP',
    'ml': 'ML',
    'cs': 'CS',
    'sql': 'SQL',
    'nosql': 'NoSQL',
    'api': 'API',
    'os': 'OS',
    'dsa': 'DSA'
  };

  function formatSegment(seg) {
    var clean = seg
      .replace(/\.html$/, '')
      .replace(/^\d+-/, '')
      .replace(/-/g, ' ');

    return clean.split(' ').map(function (word) {
      var lower = word.toLowerCase();
      return LABELS[lower] || word.charAt(0).toUpperCase() + word.slice(1);
    }).join(' ');
  }

  function buildBreadcrumbs() {
    var nav = document.getElementById('breadcrumbs');
    if (!nav) return;

    var parts = window.location.pathname
      .split('/')
      .filter(function (p) { return p !== '' && p !== 'index.html' && p !== 'index' && p !== 'index.md'; });

    if (parts.length === 0) {
      nav.style.display = 'none';
      return;
    }

    var items = [{ label: 'Home', href: '/', isLast: false }];
    var cumPath = '';

    parts.forEach(function (part, i) {
      cumPath += '/' + part;
      items.push({
        label: formatSegment(part),
        href: cumPath,
        isLast: i === parts.length - 1
      });
    });

    nav.innerHTML = items.map(function (item, i) {
      var sep = i > 0 ? ' <span class="breadcrumb-sep">/</span> ' : '';
      if (item.isLast) {
        return sep + '<span class="breadcrumb-current">' + item.label + '</span>';
      }
      return sep + '<a href="' + item.href + '">' + item.label + '</a>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', buildBreadcrumbs);
})();
</script>
