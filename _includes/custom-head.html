<!-- Apply saved theme immediately to avoid flash of unstyled content -->
<script>
(function () {
  var saved = localStorage.getItem('theme');
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>

/* ── Toggle button ───────────────────────────────────────── */
#theme-toggle {
  background: none;
  border: 1px solid currentColor;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  padding: 2px 10px;
  line-height: 1.8;
  color: inherit;
  opacity: 0.65;
  transition: opacity 0.15s;
  vertical-align: middle;
  margin-left: 12px;
}
#theme-toggle:hover {
  opacity: 1;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.createElement('button');
  btn.id = 'theme-toggle';
  btn.setAttribute('aria-label', 'Toggle dark/light mode');

  function updateBtn() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    btn.textContent = isDark ? '\u2600 Light' : '\u263E Dark';
  }
  updateBtn();

  btn.addEventListener('click', function () {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('theme', 'dark');
    }
    updateBtn();
  });

  var target = document.querySelector('.site-nav') || document.querySelector('.site-header .wrapper');
  if (target) {
    target.appendChild(btn);
  }
});
</script>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  startup: {
    ready() {
      // Kramdown converts _x_ inside $...$ to <em>x</em>, breaking MathJax's scanner.
      // Strip those <em> tags and restore underscores before MathJax processes the page.
      document.querySelectorAll('p, li, td, dt, dd, h1, h2, h3, h4').forEach(function(el) {
        if (!el.innerHTML.includes('$')) return;
        el.innerHTML = el.innerHTML.replace(/\$([^$]+)\$/g, function(match, inner) {
          if (!inner.includes('<em>')) return match;
          return '$' + inner.replace(/<\/em>/g, '_').replace(/<em>/g, '_') + '$';
        });
      });
      MathJax.startup.defaultReady();
    }
  }
};
</script>
