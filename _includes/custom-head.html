<style>
.backlinks {
  margin-top: 3rem;
  padding-top: 1.25rem;
  border-top: 1px solid #e8e8e8;
}

.backlinks-heading {
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #828282;
  margin-bottom: 0.5rem;
}

.backlinks-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.backlinks-list li a {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border: 1px solid #d0d0d0;
  border-radius: 4px;
  font-size: 0.85rem;
  color: #424242;
  text-decoration: none;
  background-color: #f8f8f8;
  transition: background-color 0.15s, border-color 0.15s;
}

.backlinks-list li a:hover {
  background-color: #ececec;
  border-color: #b0b0b0;
  text-decoration: none;
}
</style>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  startup: {
    ready() {
      // Kramdown converts _x_ inside $...$ to <em>x</em>, breaking MathJax's scanner.
      // Strip those <em> tags and restore underscores before MathJax processes the page.
      document.querySelectorAll('p, li, td, dt, dd, h1, h2, h3, h4').forEach(function(el) {
        if (!el.innerHTML.includes('$')) return;
        el.innerHTML = el.innerHTML.replace(/\$([^$]+)\$/g, function(match, inner) {
          if (!inner.includes('<em>')) return match;
          return '$' + inner.replace(/<\/em>/g, '_').replace(/<em>/g, '_') + '$';
        });
      });
      MathJax.startup.defaultReady();
    }
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" crossorigin="anonymous"></script>
